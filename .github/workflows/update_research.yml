name: Update Research Data

on:
  schedule:
    # Every Monday at 06:00 UTC (01:00 Cartagena time)
    - cron: "0 6 * * 1"
  workflow_dispatch:   # allow manual trigger from the GitHub UI

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Scopus data
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python scripts/fetch_scopus.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/research.json
          git diff --staged --quiet || git commit -m "chore: update research data [$(date -u +%Y-%m-%d)]"
          git push
